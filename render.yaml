services:
  - type: web
    name: foodbridge-api
    runtime: node
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Listing - FoodBridge</title><link rel="stylesheet" href="shared.css"></head><body>
<div id="nav"></div>
<main class="wrap">
  <a href="javascript:history.back()" class="muted">Back</a>
  <div class="msg" id="msg"></div>
  <div id="view"></div>
</main>
<script src="config.js"></script><script src="foodbridge.js"></script>
<script>
if (FB.guard()) {
  const vendor = localStorage.getItem('role') === 'vendor';
  FB.nav(vendor ? 'vendor-listings.html' : 'browse.html');
  const id = new URLSearchParams(location.search).get('id');
  FB.api('/api/listings/' + encodeURIComponent(id)).then(d => {
    const l = FB.one(d);
    document.title = l.title + ' - FoodBridge';
    document.getElementById('view').innerHTML =
      '<div class="split"><div>' + FB.photo(l, 240) +
      '<h1 style="margin-top:16px">' + FB.esc(l.title) + '</h1>' +
      (l.category ? '<span class="tag">' + FB.esc(l.category) + '</span>' : '') + '<span class="tag n">' + FB.esc(l.status) + '</span>' +
      '<p>' + FB.esc(l.description || 'No description provided.') + '</p></div>' +
      '<aside class="box"><b>' + FB.esc(l.quantity) + ' available</b>' +
      '<p class="muted" style="margin:8px 0 0">Pickup window</p><p style="margin:0 0 10px">' + FB.esc(FB.window(l)) + '</p>' +
      '<p class="muted" style="margin:0">Where</p><p style="margin:0 0 10px">' + FB.esc(l.address || 'Not set') + '</p>' +
      '<p class="muted" style="margin:0">Shared by</p><p style="margin:0 0 14px">' + FB.esc(l.vendor || 'A local vendor') + '</p>' +
      (vendor ? '<a class="btn" style="display:block" href="create-listing.html?id=' + encodeURIComponent(l.id) + '">Edit listing</a>'
              : '<button class="btn" style="width:100%" disabled title="Claiming is not built in the backend yet">Claim this food</button>') + '</aside></div>';
  }).catch(e => FB.show(document.getElementById('msg'), e.message, 'err'));
}
</script></body></html>

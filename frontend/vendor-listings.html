<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My listings - FoodBridge</title><link rel="stylesheet" href="shared.css"></head><body>
<div id="nav"></div>
<main class="wrap">
  <div class="top"><div><h1>My listings</h1><p class="muted" style="margin:0">Food you have posted. Edit or remove anything that has changed.</p></div>
  <a class="btn" href="create-listing.html">Post new food</a></div>
  <div class="msg" id="msg"></div>
  <div class="box" id="list"></div>
</main>
<script src="config.js"></script><script src="foodbridge.js"></script>
<script>
if (FB.guard('vendor')) {
  FB.nav('vendor-listings.html');
  const msg = document.getElementById('msg');
  function draw(rows) {
    document.getElementById('list').innerHTML = rows.length ? rows.map(l =>
      '<div class="row"><div><b>' + FB.esc(l.title) + '</b> <span class="tag n">' + FB.esc(l.status) + '</span><br>' +
      '<span class="muted">' + FB.esc(l.quantity) + ' available. Pickup ends ' + FB.esc(FB.when(l.pickupEnd)) + '</span></div>' +
      '<div class="acts"><a class="btn2" href="create-listing.html?id=' + encodeURIComponent(l.id) + '">Edit</a>' +
      '<button class="btn2 danger" data-del="' + FB.esc(l.id) + '">Delete</button></div></div>').join('')
      : '<p class="empty">You have not posted anything yet.</p>';
  }
  async function load() {
    try { draw(FB.list(await FB.api('/api/listings/mine'))); }
    catch (e) { FB.show(msg, e.message, 'err'); }
  }
  document.getElementById('list').addEventListener('click', async e => {
    const id = e.target.dataset.del;
    if (!id || !confirm('Delete this listing?')) return;
    try { await FB.api('/api/listings/' + encodeURIComponent(id), { method: 'DELETE' }); FB.show(msg, 'Listing deleted.', 'ok'); load(); }
    catch (err) { FB.show(msg, err.message, 'err'); }
  });
  load();
}
</script></body></html>

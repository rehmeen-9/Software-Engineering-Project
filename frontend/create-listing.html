<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Post food - FoodBridge</title><link rel="stylesheet" href="shared.css"></head><body>
<div id="nav"></div>
<main class="wrap narrow">
  <h1 id="h">Post surplus food</h1>
  <p class="muted">Tell recipients what is available and when they can collect it.</p>
  <div class="msg" id="msg"></div>
  <form class="box" id="f">
    <label for="title">Food name</label><input class="in" id="title" required maxlength="150" placeholder="e.g. Sourdough loaves">
    <label for="food_type">Food type</label>
    <select class="in" id="food_type"><option>Meals</option><option>Bakery</option><option>Produce</option><option>Packaged</option><option>Other</option></select>
    <label for="quantity">Quantity</label><input class="in" id="quantity" type="number" min="1" step="1" required value="1">
    <label for="pickup_start">Pickup starts</label><input class="in" id="pickup_start" type="datetime-local" required>
    <label for="pickup_end">Pickup ends</label><input class="in" id="pickup_end" type="datetime-local" required>
    <label for="pickup_address">Pickup address</label><input class="in" id="pickup_address" required placeholder="Shop, area, city">
    <button class="btn2" type="button" id="loc" style="margin:-6px 0 14px">Use my current location for distance search</button>
    <span class="muted" id="locnote"></span>
    <label for="photo_url">Photo link (optional)</label><input class="in" id="photo_url" type="url" placeholder="https://...">
    <label for="description">Details</label><textarea class="in" id="description" placeholder="Storage, allergens, how many people it feeds"></textarea>
    <button class="btn" id="go" type="submit">Post listing</button>
    <a class="btn2" href="vendor-listings.html">Cancel</a>
  </form>
</main>
<script src="config.js"></script><script src="foodbridge.js"></script>
<script>
if (FB.guard('vendor')) {
  FB.nav('create-listing.html');
  const id = new URLSearchParams(location.search).get('id');
  const msg = document.getElementById('msg'), F = n => document.getElementById(n);
  const text = ['title', 'food_type', 'quantity', 'pickup_address', 'photo_url', 'description'];
  let coords = null;
  F('loc').onclick = () => navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(p => { coords = { latitude: p.coords.latitude, longitude: p.coords.longitude }; F('locnote').textContent = 'Location captured.'; },
        () => F('locnote').textContent = 'Location was blocked by the browser.')
    : F('locnote').textContent = 'Location is not supported here.';
  if (id) {
    F('h').textContent = 'Edit listing'; F('go').textContent = 'Save changes';
    FB.api('/api/listings/' + encodeURIComponent(id) + '/edit').then(d => {
      const l = FB.one(d);
      F('title').value = l.title; F('food_type').value = l.category || 'Other'; F('quantity').value = l.quantity;
      F('pickup_address').value = l.address; F('photo_url').value = l.photo; F('description').value = l.description;
      F('pickup_start').value = FB.toInput(l.pickupStart); F('pickup_end').value = FB.toInput(l.pickupEnd);
    }).catch(e => FB.show(msg, e.message, 'err'));
  }
  F('f').addEventListener('submit', async e => {
    e.preventDefault();
    const body = {}; text.forEach(n => body[n] = F(n).value);
    body.quantity = Number(body.quantity);
    body.pickup_start = new Date(F('pickup_start').value).toISOString();
    body.pickup_end = new Date(F('pickup_end').value).toISOString();
    if (coords) Object.assign(body, coords);
    F('go').disabled = true;
    try {
      await FB.api(id ? '/api/listings/' + encodeURIComponent(id) : '/api/listings', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
      location.href = 'vendor-listings.html';
    } catch (err) { FB.show(msg, err.message, 'err'); F('go').disabled = false; }
  });
}
</script></body></html>

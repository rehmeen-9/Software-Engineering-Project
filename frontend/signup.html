<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up - FoodBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#202A25;font:15px/1.5 'DM Sans',system-ui,sans-serif}
    .nav{background:#202A25;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
    .brand{font:400 21px 'DM Serif Display',Georgia,serif;color:#fff;text-decoration:none}
    .nav a:last-child{color:#10281B;background:#A9D6B8;border-radius:99px;padding:7px 15px;text-decoration:none;font-size:13px}
    main{max-width:620px;margin:42px auto;padding:0 18px}
    h1{font:400 34px/1.1 'DM Serif Display',Georgia,serif;margin:0 0 8px}
    .muted{color:#66706A;font-size:13px;margin:0 0 20px}
    .panel{border:1px solid #E4E7E5;border-radius:14px;padding:22px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
    input,select{width:100%;border:1px solid #CDD3D0;border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:#202A25}
    button{width:100%;border:0;border-radius:99px;padding:11px 16px;margin-top:18px;background:#A9D6B8;color:#10281B;font:500 15px 'DM Sans';cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .message{min-height:22px;margin:12px 0 0;font-size:13px;color:#a12626}
    .switch{text-align:center;font-size:13px;margin-top:18px}
    @media(max-width:560px){.grid{grid-template-columns:1fr;gap:0}main{margin:25px auto}.panel{padding:16px}}
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="browse.html">FoodBridge</a>
    <a href="login.html">Log in</a>
  </nav>

  <main>
    <h1>Create your account</h1>
    <p class="muted">Join FoodBridge as a recipient or a food vendor.</p>

    <section class="panel">
      <form id="signupForm">
        <label for="role">Account type</label>
        <select id="role" required>
          <option value="recipient">Recipient</option>
          <option value="vendor">Vendor</option>
        </select>

        <div class="grid">
          <div>
            <label for="name">Full name</label>
            <input id="name" type="text" autocomplete="name" placeholder="Your name" required>
          </div>
          <div>
            <label for="phone">Phone (optional)</label>
            <input id="phone" type="tel" autocomplete="tel" placeholder="+92 300 0000000">
          </div>
        </div>

        <label for="address">Address (optional)</label>
        <input id="address" type="text" autocomplete="street-address" placeholder="Area, city">

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

        <div class="grid">
          <div>
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
          </div>
          <div>
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat password" required>
          </div>
        </div>

        <button id="submitButton" type="submit">Create account</button>
        <p id="message" class="message" role="alert"></p>
      </form>
    </section>

    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script src="config.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const message = document.getElementById('message');
    const submitButton = document.getElementById('submitButton');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      message.textContent = '';

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = document.getElementById('role').value;

      if (password !== confirmPassword) {
        message.textContent = 'The passwords do not match.';
        return;
      }

      const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
      if (!passwordPattern.test(password)) {
        message.textContent = 'Use at least 8 characters, including an uppercase letter, a lowercase letter and a number.';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Creating account...';

      try {
        const response = await fetch(API_URL + '/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role, phone, address })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || 'Registration failed. Please try again.');
        }

        if (!data.token || !data.user) {
          throw new Error('Your account was created, but the server did not return a login token. Please log in.');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.user.role);
        localStorage.setItem('user', JSON.stringify(data.user));

        window.location.href = data.user.role === 'vendor'
          ? 'vendor-listings.html'
          : 'browse.html';
      } catch (error) {
        message.textContent = error.message || 'Could not reach the server.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>

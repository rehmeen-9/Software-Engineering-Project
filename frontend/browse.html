<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Browse food - FoodBridge</title><link rel="stylesheet" href="shared.css"></head><body>
<div id="nav"></div>
<main class="wrap">
  <div class="top"><div><h1>Food available now</h1><p class="muted" style="margin:0">Surplus food shared by local vendors. Tap a listing for details.</p></div>
  <button class="btn2" id="near">Show nearest first</button></div>
  <input class="in" id="q" type="search" placeholder="Search by name or vendor" aria-label="Search listings">
  <div id="chips"></div>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
</main>
<script src="config.js"></script><script src="foodbridge.js"></script>
<script>
if (FB.guard('recipient')) {
  FB.nav('browse.html');
  let all = [], cat = 'All', nearMode = false;
  const q = document.getElementById('q'), msg = document.getElementById('msg'), btn = document.getElementById('near');
  function draw() {
    const t = q.value.toLowerCase();
    const rows = all.filter(l => (cat === 'All' || l.category === cat) && (l.title + ' ' + l.vendor).toLowerCase().includes(t));
    document.getElementById('grid').innerHTML = rows.length ? rows.map(l =>
      '<a class="card" href="listing-details.html?id=' + encodeURIComponent(l.id) + '">' + FB.photo(l, 96) +
      '<div class="strip"><span>' + FB.esc(l.quantity) + ' available</span><span>' + (l.distance !== undefined ? FB.esc(l.distance) + ' km away' : 'Until ' + FB.esc(FB.when(l.pickupEnd))) + '</span></div>' +
      '<div class="p"><b>' + FB.esc(l.title) + '</b><span class="muted">' + FB.esc(l.vendor) + '</span>' +
      (l.category ? '<br><span class="tag">' + FB.esc(l.category) + '</span>' : '') + '</div></a>').join('')
      : '<p class="empty">No listings match right now.</p>';
  }
  function chips() {
    const cats = ['All', 'Meals', 'Bakery', 'Produce', 'Packaged', 'Other'];
    document.getElementById('chips').innerHTML = cats.map(c => '<button class="chip' + (c === cat ? ' on' : '') + '" data-c="' + c + '">' + c + '</button>').join('');
  }
  async function load(url) {
    msg.className = 'msg';
    try { all = FB.list(await FB.api(url)); draw(); } catch (e) { FB.show(msg, e.message, 'err'); }
  }
  btn.addEventListener('click', () => {
    if (nearMode) { nearMode = false; btn.textContent = 'Show nearest first'; return load('/api/listings'); }
    if (!navigator.geolocation) return FB.show(msg, 'Your browser does not support location.', 'err');
    btn.disabled = true;
    navigator.geolocation.getCurrentPosition(p => {
      nearMode = true; btn.disabled = false; btn.textContent = 'Show all listings';
      load('/api/listings/nearby?sort=nearest&lat=' + p.coords.latitude + '&lng=' + p.coords.longitude);
    }, () => { btn.disabled = false; FB.show(msg, 'Location was blocked. Allow it in your browser to sort by distance.', 'err'); });
  });
  document.getElementById('chips').addEventListener('click', e => { if (e.target.dataset.c) { cat = e.target.dataset.c; chips(); draw(); } });
  q.addEventListener('input', draw);
  chips(); load('/api/listings');
}
</script></body></html>

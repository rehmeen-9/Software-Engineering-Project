<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse food - FoodBridge</title><link rel="stylesheet" href="shared.css">
<style>.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}select{padding:6px 10px;border:1px solid #CDD3D0;border-radius:8px;font:inherit}
.card{display:flex;gap:12px;border:1px solid #E4E7E5;border-radius:12px;padding:10px;margin:12px 0;color:inherit;text-decoration:none}
.ph{width:96px;height:96px;border-radius:8px;background:#EEF0EF;color:#66706A;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;object-fit:cover}
.empty{text-align:center;padding:40px 10px;border:1px dashed #CDD3D0;border-radius:12px}</style></head><body>
<div class="nav"><b>FoodBridge</b><a href="browse.html" style="text-decoration:underline">Browse</a><a href="my-claims.html">My claims</a></div>
<div class="w"><h1>Browse food</h1><p class="m">Available food near you, ready to collect.</p>
<div class="bar"><div id="tabs"></div><select id="sort"><option value="newest">Newest first</option><option value="soonest">Expiring soonest</option></select></div>
<div id="list">Loading...</div></div>
<script src="config.js"></script>
<script>
var TYPES=['All','Bakery','Meals','Produce','Packaged','Other'],cur='';
function tabs(){document.getElementById('tabs').innerHTML=TYPES.map(function(t,i){var f=i?t:'';return '<span class="chip'+(f===cur?' on':'')+'" data-f="'+f+'">'+t+'</span>'}).join('')}
document.getElementById('tabs').onclick=function(e){if(e.target.dataset.f!==undefined){cur=e.target.dataset.f;tabs();load()}};
document.getElementById('sort').onchange=load;
function img(l){return l.photo_url&&/^https?:\/\//i.test(l.photo_url)?'<img class="ph" alt="" src="'+esc(l.photo_url)+'" onerror="this.outerHTML=\'<div class=ph>No photo</div>\'">':'<div class="ph">No photo</div>'}
async function load(){
  var box=document.getElementById('list'),q=[];
  if(cur)q.push('food_type='+encodeURIComponent(cur));q.push('sort='+document.getElementById('sort').value);
  try{
    var r=await fetch(API_URL+'/api/listings?'+q.join('&'),{headers:authHeaders()});
    var d=await r.json();
    if(!r.ok){box.innerHTML='<p class="err">'+esc(d.message)+'</p>';return}
    box.innerHTML=d.listings.length?d.listings.map(function(l){
      return '<a class="card" href="listing-details.html?id='+l.id+'">'+img(l)+'<div><b>'+esc(l.title)+'</b><br><span class="m">'+esc(l.vendor_name)+'</span><br><span class="tag">'+l.quantity+' left</span> <span class="tag n">'+esc(l.food_type)+'</span><br><span class="m">Pickup: '+esc(fmtWindow(l.pickup_start,l.pickup_end))+'</span></div></a>'}).join('')
      :'<div class="empty"><b>'+(cur?'No '+esc(cur.toLowerCase())+' listings right now':'No food is available right now')+'</b><p class="m">New listings appear here as vendors post them. Check back soon.</p></div>';
  }catch(e){box.innerHTML='<p class="err">Could not reach the server.</p>'}
}
tabs();load();
</script></body></html>
